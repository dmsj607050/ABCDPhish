[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aidr-net"
version = "0.1.0"
description = "Appearance–Intent Disentanglement and Relational Reasoning for phishing detection"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "transformers>=4.48,<6", "beautifulsoup4>=4.12", "Pillow>=10", "tldextract>=5", "numpy>=1.24"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
aidr-train = "aidr_net.training.train:main"
aidr-predict = "aidr_net.inference:main"

[tool.setuptools.packages.find]
where = ["src"]
